<!doctype html>
<html>
  <head>
    <meta data-n-head="1" charset="utf-8">
    <meta data-n-head="1" name="viewport" content="width=device-width,initial-scale=1">
    <meta data-n-head="1" data-hid="description" name="description" content="Free Organization Chart generator and viewer">
    <meta data-n-head="1" data-hid="keywords" name="keywords" content="vuejs, nuxt, javascript, orgchart, organization, open-source">
    <title>Organization chart</title>
    <link data-n-head="1" rel="icon" type="image/x-icon" href="./favicon.ico">
    <style>
      #__nuxt, body, html { background: #fff; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; margin: 0; padding: 0; font-family: sans-serif; }
      
      /* Login Overlay Styles */
      #privacy-lock {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: #f4f7f6; display: flex; justify-content: center; 
        align-items: center; z-index: 99999;
      }
      .login-card {
        background: #fff; padding: 30px; border-radius: 8px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 320px;
      }
      .login-card h2 { color: #05668d; margin-top: 0; margin-bottom: 10px; font-size: 22px; }
      .login-card p { color: #666; font-size: 14px; margin-bottom: 20px; }
      .login-card input[type="password"] {
        width: 100%; padding: 10px; margin-bottom: 15px; 
        border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px;
      }
      .login-card button {
        background: #05668d; color: #fff; border: none; padding: 10px 20px; 
        border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%;
      }
      .login-card button:hover { background: #034f6e; }
      .error-msg { color: #d9534f; font-size: 13px; margin-top: 10px; display: none; }

      /* Original Nuxt Loading Animation Styles */
      .sk-circle{width:40px;height:40px;position:relative}
      .sk-circle .sk-child{width:100%;height:100%;position:absolute;left:0;top:0}
      .sk-circle .sk-child:before{content:'';display:block;margin:0 auto;width:15%;height:15%;background-color:#05668d;border-radius:100%;-webkit-animation:sk-circleBounceDelay 1.2s infinite ease-in-out both;animation:sk-circleBounceDelay 1.2s infinite ease-in-out both}
      .sk-circle .sk-circle2{-webkit-transform:rotate(30deg);-ms-transform:rotate(30deg);transform:rotate(30deg)}
      .sk-circle .sk-circle3{-webkit-transform:rotate(60deg);-ms-transform:rotate(60deg);transform:rotate(60deg)}
      .sk-circle .sk-circle4{-webkit-transform:rotate(90deg);-ms-transform:rotate(90deg);transform:rotate(90deg)}
      .sk-circle .sk-circle5{-webkit-transform:rotate(120deg);-ms-transform:rotate(120deg);transform:rotate(120deg)}
      .sk-circle .sk-circle6{-webkit-transform:rotate(150deg);-ms-transform:rotate(150deg);transform:rotate(150deg)}
      .sk-circle .sk-circle7{-webkit-transform:rotate(180deg);-ms-transform:rotate(180deg);transform:rotate(180deg)}
      .sk-circle .sk-circle8{-webkit-transform:rotate(210deg);-ms-transform:rotate(210deg);transform:rotate(210deg)}
      .sk-circle .sk-circle9{-webkit-transform:rotate(240deg);-ms-transform:rotate(240deg);transform:rotate(240deg)}
      .sk-circle .sk-circle10{-webkit-transform:rotate(270deg);-ms-transform:rotate(270deg);transform:rotate(270deg)}
      .sk-circle .sk-circle11{-webkit-transform:rotate(300deg);-ms-transform:rotate(300deg);transform:rotate(300deg)}
      .sk-circle .sk-circle12{-webkit-transform:rotate(330deg);-ms-transform:rotate(330deg);transform:rotate(330deg)}
      .sk-circle .sk-circle2:before{-webkit-animation-delay:-1.1s;animation-delay:-1.1s}
      .sk-circle .sk-circle3:before{-webkit-animation-delay:-1s;animation-delay:-1s}
      .sk-circle .sk-circle4:before{-webkit-animation-delay:-.9s;animation-delay:-.9s}
      .sk-circle .sk-circle5:before{-webkit-animation-delay:-.8s;animation-delay:-.8s}
      .sk-circle .sk-circle6:before{-webkit-animation-delay:-.7s;animation-delay:-.7s}
      .sk-circle .sk-circle7:before{-webkit-animation-delay:-.6s;animation-delay:-.6s}
      .sk-circle .sk-circle8:before{-webkit-animation-delay:-.5s;animation-delay:-.5s}
      .sk-circle .sk-circle9:before{-webkit-animation-delay:-.4s;animation-delay:-.4s}
      .sk-circle .sk-circle10:before{-webkit-animation-delay:-.3s;animation-delay:-.3s}
      .sk-circle .sk-circle11:before{-webkit-animation-delay:-.2s;animation-delay:-.2s}
      .sk-circle .sk-circle12:before{-webkit-animation-delay:-.1s;animation-delay:-.1s}
      @-webkit-keyframes sk-circleBounceDelay{0%,100%,80%{-webkit-transform:scale(0);transform:scale(0)}40%{-webkit-transform:scale(1);transform:scale(1)}}
      @keyframes sk-circleBounceDelay{0%,100%,80%{-webkit-transform:scale(0);transform:scale(0)}40%{-webkit-transform:scale(1);transform:scale(1)}}
    </style>
  </head>
  <body>

    <div id="privacy-lock">
      <div class="login-card">
        <h2>Protected Access</h2>
        <p>Please enter the password to view the organization chart.</p>
        <input type="password" id="password-input" placeholder="Password..." onkeydown="if(event.key === 'Enter') verifyPassword()">
        <button onclick="verifyPassword()">Login</button>
        <div id="error-message" class="error-msg">Incorrect password!</div>
      </div>
    </div>

    <div id="__nuxt">
      <div class="sk-circle"> 
        <div class="sk-circle1 sk-child"></div> 
        <div class="sk-circle2 sk-child"></div> 
        <div class="sk-circle3 sk-child"></div> 
        <div class="sk-circle4 sk-child"></div> 
        <div class="sk-circle5 sk-child"></div> 
        <div class="sk-circle6 sk-child"></div> 
        <div class="sk-circle7 sk-child"></div> 
        <div class="sk-circle8 sk-child"></div> 
        <div class="sk-circle9 sk-child"></div> 
        <div class="sk-circle10 sk-child"></div> 
        <div class="sk-circle11 sk-child"></div> 
        <div class="sk-circle12 sk-child"></div> 
      </div> 
    </div>

    <script>
      // SHA-256 Hash of your preferred password. 
      // The hash below corresponds to the password: "kctec-privacy"
      const PASSWORD_HASH = "faeef49b499119159931b674828da1b9804e17db912be216259024f944d67362";

      async function sha256(string) {
        const utf8 = new TextEncoder().encode(string);
        const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      }

      async function verifyPassword() {
        const input = document.getElementById('password-input').value;
        const inputHash = await sha256(input);
        const errorDiv = document.getElementById('error-message');

        if (inputHash === PASSWORD_HASH) {
          // Hide login screen
          document.getElementById('privacy-lock').style.display = 'none';
          
          // Initialise Nuxt configurations context
          window.__NUXT__ = { config: { _app: { basePath: "/", assetsPath: "./", cdnURL: null } } };
          
          // Dynamically load dependencies in order only after successful login
          const scripts = ["./data.js", "./config.js", "./translate.js", "./e8cd43a.js", "./a865292.js", "./8e0b1c0.js", "./1b3c704.js"];
          
          loadScriptsSequentially(scripts);
        } else {
          errorDiv.style.display = 'block';
        }
      }

      function loadScriptsSequentially(scriptArray) {
        if (scriptArray.length === 0) return;
        const src = scriptArray.shift();
        const script = document.createElement('script');
        script.src = src;
        script.async = false; // Preserves sequential loading order 
        script.onload = function() {
          loadScriptsSequentially(scriptArray);
        };
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
